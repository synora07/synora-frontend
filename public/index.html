<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SYNORA &ndash; Unabh&auml;ngige Produktempfehlungen aus Schweizer Shops</title>
  <meta name="description" content="SYNORA vergleicht Produkte aus Schweizer Shops, begr&uuml;ndet jede Empfehlung und nennt bei jedem Produkt auch einen Nachteil." />

  <!-- Faerbt auf dem Handy die Browserleiste oben. Ohne das
       steht ueber der dunklen Seite ein weisser Balken. -->
  <meta name="theme-color" content="#050B1A" />
  <meta name="color-scheme" content="dark" />

  <!-- %PUBLIC_URL% ersetzt Create React App beim Bauen durch den
       richtigen Pfad. Ohne diesen Platzhalter funktionieren die
       Symbole nur lokal, aber nicht auf Vercel. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Schriften frueh anfordern, damit der Text nicht erst in
       Arial erscheint und dann umspringt. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fuer geteilte Links in WhatsApp, Slack und sozialen Netzen -->
  <meta property="og:title" content="SYNORA &ndash; Unabh&auml;ngige Produktempfehlungen" />
  <meta property="og:description" content="Vergleicht Produkte aus Schweizer Shops, begr&uuml;ndet jede Empfehlung und nennt bei jedem Produkt auch einen Nachteil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://synora.li" />
  <meta property="og:image" content="https://synora.li/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <noscript>F&uuml;r SYNORA muss JavaScript eingeschaltet sein.</noscript>
  <div id="root"></div>
</body>
</html>
